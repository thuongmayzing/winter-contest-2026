<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winter Contest 2026 - Mayzing</title>
  <!-- Google Fonts: Montserrat & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Brand Palette */
      --main-color: #191265;
      --contrast-color: #6B5BFF;
      --accent-color: #66D9D1;
      --bg-dark: #0f0c3f;
      
      /* Soft Gold Accents (Đã làm nhạt màu vàng vòng tròn để tránh chói) */
      --gold-main: #fcd34d;
      --gold-light: #fffbeb;
      --gold-gradient: linear-gradient(135deg, #fef08a 0%, #f59e0b 100%);
      
      --card-bg: #ffffff;
      --text-dark: #191265;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at top center, #191265 0%, #0f0c3f 100%);
      min-height: 100vh;
      color: var(--text-dark);
      padding: 30px 15px;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    /* LOGIN SCREEN */
    #login-screen {
      max-width: 400px;
      margin: 80px auto;
      background: var(--card-bg);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    #login-screen h2 {
      margin: 0 0 10px 0;
      font-family: 'Montserrat', sans-serif;
      color: var(--main-color);
      font-size: 24px;
      font-weight: 800;
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }

    .input:focus {
      border-color: var(--contrast-color);
      box-shadow: 0 0 0 4px rgba(107, 91, 255, 0.15);
    }

    .btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--contrast-color);
      color: white;
      font-size: 15px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(107, 91, 255, 0.4);
    }

    .btn:hover {
      background: #5a4ce5;
      transform: translateY(-1px);
    }

    .error {
      color: #ef4444;
      margin-top: 12px;
      font-size: 13px;
      font-weight: 600;
    }

    /* MAIN APP LAYOUT (2/3 & 1/3) */
    #dashboard {
      display: none;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 2fr 1fr; /* 2/3 Personal, 1/3 Leaderboard */
      gap: 20px;
      align-items: start;
    }

    /* LEFT CARD: PERSONAL PROGRESS */
    .personal-card {
      background: var(--card-bg);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    /* HEADER BANNER */
    .contest-header {
      background: var(--main-color);
      padding: 30px 20px 24px 20px;
      text-align: center;
      color: white;
      position: relative;
    }

    .contest-header h1 {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .contest-subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: var(--accent-color);
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .contest-date {
      margin-top: 8px;
      font-size: 12px;
      color: #a5b4fc;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .level-badge {
      display: inline-block;
      margin-top: 14px;
      background: var(--gold-gradient);
      color: #78350f;
      padding: 6px 20px;
      border-radius: 999px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      text-transform: uppercase;
    }

    .personal-body {
      padding: 30px 24px;
    }

    /* CIRCULAR TARGET (NEXT REWARD) - LÀM NHẠT MÀU VÀNG */
    .circle-target-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .circle-target {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 6px solid var(--gold-main);
      display: flex;
      flex-direction: column;
